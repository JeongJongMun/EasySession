; Redirects for names that changed during development, so Blueprints saved against
; an earlier build fix themselves up on load instead of ending up with orphaned nodes.
; Class redirects are applied before function redirects, so the function entries below
; use the new class name.

[CoreRedirects]
+ClassRedirects=(OldName="/Script/EasySession.EasyLeaveSessionNode",NewName="/Script/EasySession.EasyDestroySessionNode")
+FunctionRedirects=(OldName="/Script/EasySession.EasyDestroySessionNode.LeaveEasySession",NewName="/Script/EasySession.EasyDestroySessionNode.DestroyEasySession")
+FunctionRedirects=(OldName="/Script/EasySession.EasySessionSubsystem.EndSessionForEveryone",NewName="/Script/EasySession.EasySessionSubsystem.DestroyEasySessionForEveryone")
