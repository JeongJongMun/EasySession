; Redirects for names that changed during development, so Blueprints saved against
; an earlier build fix themselves up on load instead of ending up with orphaned nodes.
; Class redirects are applied before function redirects, so the function entries below
; use the new class name.

[CoreRedirects]
+ClassRedirects=(OldName="/Script/EasySession.EasyLeaveSessionNode",NewName="/Script/EasySession.EasyDestroySessionNode")
+FunctionRedirects=(OldName="/Script/EasySession.EasyDestroySessionNode.LeaveEasySession",NewName="/Script/EasySession.EasyDestroySessionNode.DestroyEasySession")
+FunctionRedirects=(OldName="/Script/EasySession.EasySessionSubsystem.EndSessionForEveryone",NewName="/Script/EasySession.EasySessionSubsystem.DestroyEasySessionForEveryone")

; Quick Play was renamed to Quick Match.
+ClassRedirects=(OldName="/Script/EasySession.EasyQuickPlayNode",NewName="/Script/EasySession.EasyQuickMatchNode")
+FunctionRedirects=(OldName="/Script/EasySession.EasyQuickMatchNode.QuickPlayEasySession",NewName="/Script/EasySession.EasyQuickMatchNode.QuickMatchEasySession")
+StructRedirects=(OldName="/Script/EasySession.EasyQuickPlayParams",NewName="/Script/EasySession.EasyQuickMatchParams")
; Renaming the parameter renames the node's pin, and a graph saved against the old
; build keeps the old pin until a redirect maps it. This one is deliberately the bare
; pin name: only UK2Node_CallFunction adds the Class.Function.Param forms in
; GetRedirectPinNames, and an async action node (which this is) inherits the base
; version that offers the pin name alone.
+PropertyRedirects=(OldName="QuickPlayParams",NewName="QuickMatchParams")
