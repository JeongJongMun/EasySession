[FilterPlugin]
; Files the default BuildPlugin whitelist drops but a distributed plugin needs:
; the license (a condition of MIT), both readmes, the documentation the readmes
; point at, and the plugin config carrying the CoreRedirects.
/LICENSE
/README.md
/README.ko.md
/Docs/...
/Config/...

; Our regression tests, which would otherwise register in every installing
; project and create real sessions there. The default whitelist only drops a
; Tests folder at the plugin root, not one under Source.
-/Source/EasySession/Private/Tests/...
